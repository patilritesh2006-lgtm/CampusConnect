version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/campusconnect?schema=public"
      JWT_SECRET: "campusconnect_super_secret_jwt_key_2026"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
