<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Network Connection Arc & Lines -->
  <g filter="url(#glow)">
    <!-- Arc -->
    <path d="M 130 180 A 145 145 0 0 1 370 180" fill="none" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" />
    
    <!-- Connection Spokes to Center -->
    <line x1="130" y1="180" x2="250" y2="230" stroke="#00d2ff" stroke-width="7" />
    <line x1="185" y1="110" x2="250" y2="230" stroke="#00d2ff" stroke-width="7" />
    <line x1="250" y1="80" x2="250" y2="230" stroke="#00d2ff" stroke-width="8" />
    <line x1="315" y1="110" x2="250" y2="230" stroke="#00d2ff" stroke-width="7" />
    <line x1="370" y1="180" x2="250" y2="230" stroke="#00d2ff" stroke-width="7" />
  </g>

  <!-- Network Nodes -->
  <circle cx="130" cy="180" r="16" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="185" cy="110" r="16" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="250" cy="80" r="18" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="315" cy="110" r="16" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="370" cy="180" r="16" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="4" />

  <!-- Center Hub Node -->
  <circle cx="250" cy="230" r="22" fill="#ffffff" stroke="#0077ff" stroke-width="6" />
  <circle cx="250" cy="230" r="10" fill="#0077ff" />

  <!-- Graduation Cap Main Body -->
  <!-- Left Dark Navy Section -->
  <path d="M 110 230 L 250 170 L 250 290 L 110 230 Z" fill="#0f172a" />
  <!-- Right Cyan-Accented Section -->
  <path d="M 250 170 L 390 230 L 250 290 Z" fill="url(#cyanGrad)" opacity="0.9" />
  <path d="M 250 170 L 390 230 L 320 260 L 250 230 Z" fill="#0284c7" />

  <!-- Cap Lower Base -->
  <path d="M 160 250 L 160 310 C 160 330 200 360 250 360 C 300 360 340 330 340 310 L 340 250 C 310 275 280 285 250 285 C 220 285 190 275 160 250 Z" fill="#0f172a" />

  <!-- Tassel -->
  <path d="M 130 230 L 130 295 C 130 305 120 305 120 295 L 120 230 Z" fill="#0f172a" />
  <path d="M 115 295 L 135 295 L 130 330 L 120 330 Z" fill="#0284c7" />
  <circle cx="125" cy="295" r="5" fill="#0f172a" />
</svg>
