<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="cyanNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BACKGROUND GLOW / ACCENT -->
  <circle cx="250" cy="220" r="140" fill="#00b4d8" opacity="0.04" />

  <!-- GEODESIC NETWORK DOME (CYAN) -->
  <g stroke="#0096c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)">
    <!-- Top Apex Connections -->
    <line x1="250" y1="80" x2="215" y2="100" />
    <line x1="250" y1="80" x2="285" y2="100" />
    <line x1="250" y1="80" x2="250" y2="135" />
    <line x1="250" y1="80" x2="180" y2="150" />
    <line x1="250" y1="80" x2="320" y2="150" />

    <!-- Upper Dome Grid -->
    <line x1="215" y1="100" x2="180" y2="150" />
    <line x1="285" y1="100" x2="320" y2="150" />
    <line x1="215" y1="100" x2="250" y2="135" />
    <line x1="285" y1="100" x2="250" y2="135" />
    <line x1="250" y1="135" x2="200" y2="190" />
    <line x1="250" y1="135" x2="300" y2="190" />

    <!-- Middle & Outer Ring Connections -->
    <line x1="180" y1="150" x2="160" y2="210" />
    <line x1="320" y1="150" x2="340" y2="210" />
    <line x1="180" y1="150" x2="200" y2="190" />
    <line x1="320" y1="150" x2="300" y2="190" />
    <line x1="160" y1="210" x2="250" y2="210" />
    <line x1="340" y1="210" x2="250" y2="210" />
    <line x1="160" y1="210" x2="175" y2="270" />
    <line x1="340" y1="210" x2="325" y2="270" />
    <line x1="250" y1="210" x2="250" y2="250" />
    <line x1="250" y1="250" x2="325" y2="270" />
    <line x1="250" y1="250" x2="175" y2="270" />
  </g>

  <!-- NETWORK NODES -->
  <g fill="#0077b6" stroke="#ffffff" stroke-width="3">
    <!-- Top Apex Node -->
    <circle cx="250" cy="80" r="10" fill="#0096c7" />
    <!-- Tier 1 Nodes -->
    <circle cx="215" cy="100" r="8" fill="#0096c7" />
    <circle cx="285" cy="100" r="8" fill="#0096c7" />
    <circle cx="250" cy="135" r="9" fill="#0096c7" />
    <!-- Tier 2 Nodes -->
    <circle cx="180" cy="150" r="9" fill="#0096c7" />
    <circle cx="320" cy="150" r="9" fill="#0096c7" />
    <circle cx="200" cy="190" r="8" fill="#0096c7" />
    <circle cx="300" cy="190" r="8" fill="#0096c7" />
    <!-- Tier 3 Outer Nodes -->
    <circle cx="160" cy="210" r="10" fill="#0096c7" />
    <circle cx="340" cy="210" r="10" fill="#0096c7" />
    <circle cx="175" cy="270" r="9" fill="#0096c7" />
    <circle cx="325" cy="270" r="9" fill="#0096c7" />
    <!-- Cap Center Connect Node -->
    <circle cx="250" cy="210" r="12" fill="#0b1e36" stroke="#00b4d8" stroke-width="4" />
    <circle cx="250" cy="250" r="9" fill="#0096c7" />
  </g>

  <!-- GRADUATION CAP (NAVY BLUE #0b1e36) -->
  <!-- Mortarboard Diamond Top Outline & Body -->
  <path d="M 150 210 L 250 150 L 350 210 L 250 270 Z" fill="#ffffff" stroke="#0b1e36" stroke-width="12" stroke-linejoin="round" />
  <path d="M 155 210 L 250 155 L 345 210 L 250 265 Z" fill="#ffffff" />
  <path d="M 250 160 L 340 210 L 250 260 L 160 210 Z" fill="none" stroke="#0b1e36" stroke-width="8" />

  <!-- Lower Cap Headpiece -->
  <path d="M 195 240 L 195 290 C 195 315 220 345 250 345 C 280 345 305 315 305 290 L 305 240" fill="none" stroke="#0b1e36" stroke-width="12" stroke-linecap="round" />
  <path d="M 200 245 L 200 290 C 200 310 222 340 250 340 C 278 340 300 310 300 290 L 300 245 Z" fill="#ffffff" />
  <path d="M 205 245 C 205 285 225 330 250 330 C 275 330 295 285 295 245" fill="none" stroke="#0b1e36" stroke-width="8" stroke-linecap="round" />

  <!-- Tassel Hanging from Left -->
  <path d="M 175 210 L 175 270" stroke="#0b1e36" stroke-width="6" stroke-linecap="round" />
  <circle cx="175" cy="270" r="6" fill="#0b1e36" />
  <path d="M 170 275 L 180 275 L 184 315 L 166 315 Z" fill="#0b1e36" />
</svg>
