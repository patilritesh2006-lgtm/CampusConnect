name: CampusConnect CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Node.js & Prisma & Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: campusconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client & Push DB Schema
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/campusconnect?schema=public"
          JWT_SECRET: "ci_pipeline_super_secret_jwt_key_at_least_32_chars_long"
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Backend Test Suites (Jest)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/campusconnect?schema=public"
          JWT_SECRET: "ci_pipeline_super_secret_jwt_key_at_least_32_chars_long"
          NODE_ENV: test
        run: npm test

  frontend:
    name: Frontend CI (Vite Build & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Application (Vite)
        working-directory: ./frontend
        run: npm run build
