<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="certBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="#ffffff"/>
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="url(#certBorder)" stroke-width="6"/>
  <rect x="30" y="30" width="740" height="440" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Certificate Content -->
  <text x="400" y="90" text-anchor="middle" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="28" font-weight="900" letter-spacing="2">CAMPUSCONNECT</text>
  <text x="400" y="115" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="600" letter-spacing="4">CERTIFICATE OF COMPLETION</text>

  <text x="400" y="170" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14">This is proudly presented to</text>
  <text x="400" y="215" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="32" font-weight="800">Ritesh Patil</text>
  <line x1="250" y1="230" x2="550" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="265" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15">For successfully participating and demonstrating excellence in</text>
  <text x="400" y="295" text-anchor="middle" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="20" font-weight="700">National AI Hackathon 2026</text>

  <!-- Credential Badge & Signatures -->
  <rect x="80" y="370" width="220" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="95" y="395" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">VERIFICATION CODE</text>
  <text x="95" y="415" fill="#0f172a" font-family="monospace" font-size="13" font-weight="700">CC-2026-AIHA-7F3A9C</text>

  <!-- LinkedIn Share Button Mock -->
  <rect x="520" y="380" width="200" height="42" rx="8" fill="#0077b5"/>
  <text x="620" y="406" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="700">+ Add to LinkedIn</text>
</svg>
