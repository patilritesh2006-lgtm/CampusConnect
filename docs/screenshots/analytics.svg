  <text x="40" y="160" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="24" font-weight="800">1,248</text>

  <rect x="216" y="100" width="175" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="232" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">Total Events</text>
  <text x="232" y="160" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="24" font-weight="800">42</text>

  <rect x="408" y="100" width="175" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="424" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">Overall Attendance</text>
