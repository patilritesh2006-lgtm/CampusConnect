  <rect x="601" y="100" width="175" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="617" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">Avg Engagement</text>
