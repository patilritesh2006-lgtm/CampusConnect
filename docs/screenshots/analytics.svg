  <!-- Department Performance Chart -->
  <rect x="24" y="205" width="752" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="45" y="235" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="700">Department Engagement Breakdown</text>

  <!-- Bars -->
  <text x="45" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">Computer Science</text>
