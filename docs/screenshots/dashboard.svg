<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#dashBg)"/>
  <!-- Header Bar -->
  <rect x="24" y="24" width="752" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="56" cy="54" r="16" fill="#3b82f6"/>
  <text x="84" y="60" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="18" font-weight="700">CampusConnect</text>
  <rect x="620" y="42" width="130" height="24" rx="12" fill="#334155"/>
  <text x="640" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">Level 3 • 450 XP</text>
  
  <!-- Welcome Banner -->
  <rect x="24" y="100" width="752" height="90" rx="14" fill="url(#accentGrad)"/>
  <text x="50" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="22" font-weight="800">Welcome Back, Ritesh Patil!</text>
  <text x="50" y="165" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13">You have 2 upcoming events today and 1 certificate ready to verify.</text>

  <!-- Metric Cards -->
  <rect x="24" y="210" width="235" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="44" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">Events Registered</text>
  <text x="44" y="278" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="28" font-weight="800">12</text>

  <rect x="282" y="210" width="235" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="302" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">Attendance Rate</text>
  <text x="302" y="278" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="28" font-weight="800">92%</text>

  <rect x="541" y="210" width="235" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="561" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">Verified Credentials</text>
  <text x="561" y="278" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="28" font-weight="800">4</text>

  <!-- Bottom Panel: Quick Actions & Live QR Scanner -->
  <rect x="24" y="325" width="493" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="44" y="355" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" font-weight="700">🤖 AI Recommendation</text>
  <text x="44" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">National AI Hackathon 2026 matches 95% of your skill profile.</text>

  <rect x="541" y="325" width="235" height="100" rx="12" fill="#2563eb"/>
  <text x="610" y="370" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="16" font-weight="700">Scan QR Code</text>
  <text x="590" y="392" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">+50 XP Instant Check-In</text>
</svg>
